name: Deploy

on:
  push:
    branches:
      - main
      - quality
      - production
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment a fazer deploy"
        required: true
        type: choice
        options:
          - quality
          - production

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Quality gates — run on every push and pull request. Deploy jobs depend on
  # these, so a broken build/test/lint blocks the deploy.
  # ---------------------------------------------------------------------------
  quality-backend:
    name: Backend (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Chains: prisma generate -> vitest -> eslint -> tsc -> postbuild copy.
      # Vitest is scoped to unit specs; Playwright e2e runs separately.
      - name: Lint, test & typecheck
        working-directory: backend
        run: npm run build

      # Rotas e códigos de erro têm de estar em API.md/openapi.yaml. Falha o
      # CI (e o deploy) se o código mudou sem atualizar a documentação.
      - name: Docs em sincronia com o código
        working-directory: backend
        run: npm run check:docs

  quality-frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Chains: vitest run -> next build.
      - name: Test & build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  quality-mcp:
    name: MCP context server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      # Zero dependencies: the test spawns the server and speaks JSON-RPC.
      - name: Test MCP context server
        working-directory: tools/mcp-context
        run: npm test

  # ---------------------------------------------------------------------------
  # E2E — both Playwright suites against a throwaway MySQL inside the runner.
  # A DB exists only for the job's length: no secrets, no external access, and
  # production is never touched. CI=1 (set automatically) makes Playwright
  # spawn its own servers with reuseExistingServer disabled.
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E (auth · SSE · browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-backend, quality-frontend]
    services:
      # throwaway DB: created on job start, deleted with the runner.
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: e2e_throwaway_pwd
          MYSQL_DATABASE: template_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # Env das validations do backend (src/config/env.ts) e dos dev servers
    # que o Playwright lança. As secrets abaixo (JWT/ENCRYPTION) são valores
    # únicos e throwaway para e2e ONLY, não partilham nada com os ambientes
    # reais (gerados uma vez, commitados como constantes de teste).
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: e2e_throwaway_pwd
      DATABASE_NAME: template_e2e
      # DATABASE_URL é esperado pelo schema do Prisma (CLI: db push/db-seed).
      DATABASE_URL: mysql://root:e2e_throwaway_pwd@127.0.0.1:3306/template_e2e
      JWT_SECRET: S2wlpNwpxfJ04eTXTXTBO0tXxQOGMnMc3Clf0S93tanBKaHuIIabAmrpUmr9lrE8d5a5cf8bf25a7d4c61e0b5844070961
      ENCRYPTION_KEY: 4582841562d7fbcbd5abfc9aeb60a58c8248c0ca3863a56b7c17db67b754a811
      FRONT_URL: http://localhost:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (backend)
        working-directory: backend
        run: npm ci

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      # Schema + utilizadores seed em base de dados vazia.
      - name: Prepare schema & seed
        working-directory: backend
        run: npm run db-update && npm run db-seed

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Backend E2E (auth API · SSE stream · health)
        working-directory: backend
        run: npm run test:e2e

      - name: Frontend E2E (login · logout · error states)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            backend/playwright-report/
            backend/test-results/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Deploy — only on pushes to quality/production and manual dispatch.
  # ---------------------------------------------------------------------------
  set-environment:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'production'))
    needs: [quality-backend, quality-frontend, quality-mcp, e2e-tests]
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
    steps:
      - name: Resolver nome do environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env_name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'production'))
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    env:
      CPANEL_HOST: ${{ secrets.FRONTEND_CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.FRONTEND_CPANEL_USER }}
      CPANEL_API_TOKEN: ${{ secrets.FRONTEND_CPANEL_API_TOKEN }}
      DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
      ZIP_FILE: deploy.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Tests already ran in quality-frontend; just produce the build artifact.
      - name: Build
        working-directory: frontend
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Preparar standalone bundle
        working-directory: frontend
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          zip -rq ../../../deploy.zip .

      - name: Upload zip para cPanel
        run: bash .github/scripts/cpanel-deploy.sh upload

      - name: Extrair zip no servidor
        run: bash .github/scripts/cpanel-deploy.sh extract

      - name: Restart Passenger (frontend)
        run: bash .github/scripts/cpanel-deploy.sh restart

      - name: Limpar zip do servidor
        if: success()
        run: bash .github/scripts/cpanel-deploy.sh cleanup

  deploy-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'production'))
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    env:
      CPANEL_HOST: ${{ secrets.BACKEND_CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.BACKEND_CPANEL_USER }}
      CPANEL_API_TOKEN: ${{ secrets.BACKEND_CPANEL_API_TOKEN }}
      DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
      ZIP_FILE: deploy.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Full install first: prisma generate + tsc need devDependencies.
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Tests/lint already ran in quality-backend; just compile the artifact.
      - name: Compile
        working-directory: backend
        run: |
          npx prisma generate
          npx tsc

      # The Prisma client is generated to src/generated (custom output), so it
      # must be copied next to the compiled code and shipped in the bundle.
      - name: Copy generated Prisma client into dist
        working-directory: backend
        run: cp -r src/generated dist/generated

      # Prune to production dependencies for a smaller, safer runtime bundle.
      - name: Prune to production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Preparar bundle
        working-directory: backend
        run: |
          mkdir -p deploy-staging
          cp -r dist deploy-staging/dist
          cp -r node_modules deploy-staging/node_modules
          cp -r prisma deploy-staging/prisma
          cp package.json deploy-staging/package.json
          cp package-lock.json deploy-staging/package-lock.json
          cd deploy-staging
          zip -rq ../../deploy.zip .

      - name: Upload zip para cPanel
        run: bash .github/scripts/cpanel-deploy.sh upload

      - name: Extrair zip no servidor
        run: bash .github/scripts/cpanel-deploy.sh extract

      - name: Restart Passenger (backend)
        run: bash .github/scripts/cpanel-deploy.sh restart

      - name: Limpar zip do servidor
        if: success()
        run: bash .github/scripts/cpanel-deploy.sh cleanup
